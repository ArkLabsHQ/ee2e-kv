# Enclave deployment config for the E2EE KV reference app.
# Edit nix_rev / nix_hash / nix_vendor_hash after pushing to GitHub.
# Use `enclave setup` to compute hashes.

name: e2ee-kv
version: 0.0.1
region: us-east-1
account: "000000000000"
prefix: dev
instance_type: m6i.xlarge
nix_image: nixos/nix:2.24.9
migration_cooldown: "1m"

# Framework supervisor binary coordinates. Bump these to upgrade the supervisor.
runtime:
  rev: "v0.0.62"
  hash: "sha256-xa7ukVvTTXqHn7L4MOwVv+L8N20vO8MKiXrbj4Mvhjo="
  vendor_hash: "sha256-nj/KWLaYuxV67ytwoX5YnnWlGzsTKrm8TL7EpLPAC40="

app:
  language: "nodejs"
  source: nix

  # GitHub coordinates of THIS repo. Update after first push.
  nix_owner: "PLACEHOLDER_OWNER"
  nix_repo: "enclave-e2ee-kv"
  nix_rev: "PLACEHOLDER_REV"
  nix_hash: "PLACEHOLDER_HASH"
  nix_vendor_hash: "PLACEHOLDER_VENDOR_HASH"

  binary_name: "e2ee-kv-server"
  release_tag: "eif-latest"

  env:
    # Public-facing relying-party identity for WebAuthn — must match the host
    # the user's browser sees. Override per-deployment via tofu.
    RP_ID: "localhost"
    RP_NAME: "Enclave KV"
    RP_ORIGIN: "http://localhost:7074"
    APP_VERSION: "0.0.1"

# HMAC key for the per-session JWT (auth_token). Generated at first boot,
# decrypted from KMS at every subsequent boot, exposed as $AUTH_TOKEN_KEY.
secrets:
  - name: auth_token_key
    env_var: AUTH_TOKEN_KEY
