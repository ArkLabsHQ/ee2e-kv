# Enclave configuration
# Edit this file then run: enclave init

name: e2ee-kv                    # App name (used in stack name, EIF name)
version: 0.0.1                   # Build version (semver, baked into binary via ldflags)
region: us-east-1                # AWS region
account: ""                      # AWS account ID (required)
prefix: dev                      # Deployment prefix (stack = {prefix}Nitro{Name})
instance_type: m6i.xlarge        # EC2 instance type
migration_cooldown: "1m"         # Cooldown before migration proceeds
is_kms_key_locked: false         # false (default): grant AWS root kms:PutKeyPolicy on the locked key — recovery from lockout works by adding a new PCR0 condition.
                                 # true:             strict mode — the locked policy is frozen; even root cannot rewrite it. Only the attested enclave can decrypt.

# Runtime coordinates for the enclave supervisor binary.
# The supervisor handles attestation, secrets, PCR extension, and signing
# middleware automatically. Your app is a plain HTTP server with zero runtime imports.
runtime:
  rev: "v0.0.75"
  hash: "sha256-QKz8cYewOBJFf854DXkkIajPgQskBc8xmHsrie2R1Oc="
  vendor_hash: "sha256-2ZX9x2voIwVkUsmrZvhJssAQqnCh8/HLwopL5HpiaOg="

app:
  language: "nodejs"             # App language: go, nodejs, dotnet, rust
  source: nix                    # "nix" = fetch from GitHub via Nix

  # GitHub coordinates for the app to run inside the enclave.
  # Your app is a plain HTTP server that listens on ENCLAVE_APP_PORT (default 7074).
  # Secrets are passed as environment variables. No runtime imports needed.
  nix_owner: "ArkLabsHQ"                  # GitHub owner (required)
  nix_repo: "ee2e-kv"                   # GitHub repo name (required)
  nix_rev: "3ae4d37036933449a64c41b7d91de69bc75e5df3"                    # Git commit SHA (required)
  nix_hash: "sha256-9zNxHhF02dpF1u7Q3OR7bP+vflYK/N8HdQnCavYN6FE="                   # Nix source hash: nix-prefetch-url --unpack (required)
  nix_vendor_hash: "sha256-3xdyvKRL8I7BUKzRTyhwi8bXqyKTbwgGMZYIqxOw0YU="            # Go vendor hash (required)
  nix_sub_packages:              # Unused for nodejs apps (Go-only); leave as-is
    - "."
  nix_subdir: ""                 # Empty: build runs at workspace root so npm workspaces resolve
  binary_name: "e2ee-kv-server"  # Output binary name — must match server/package.json "name"
  release_tag: "eif-latest"      # GitHub Release tag used by 'enclave tofu --remote'

  # Environment variables baked into the EIF as build-time defaults
  # (each value contributes to PCR0). Tofu can override any key here
  # at deploy time via -var 'env_values={"MY_KEY":"new-value"}' without
  # rebuilding the EIF — the runtime overlays the SSM value on top of
  # the baked default at boot.
  # Template vars: {{region}}, {{prefix}}, {{version}}
  env:
    # WebAuthn relying-party identity. RP_ID and RP_ORIGIN must match the
    # public hostname/scheme the user's browser sees. Override per-deployment
    # via `enclave tofu` -var 'env_values=...'.
    RP_ID: "localhost"
    RP_NAME: "Enclave KV"
    # Baked default targets the regtest fixture origin (test/browser/ static
    # server on :5174). `make dev` overrides this to http://localhost:5173 by
    # exporting RP_ORIGIN directly into the user-app's process env (which wins
    # over baked defaults). Production deployments rebuild the EIF with their
    # real origin baked in — until the framework's SSM env_override path is
    # fixed (currently the supervisor reads SSM but doesn't propagate into the
    # exec'd user-app's environment).
    RP_ORIGIN: "http://localhost:5174"
    APP_VERSION: "0.0.1"
    # Comma-separated list of consumer-webapp origins allowed to call /api/*
    # cross-origin. Same baking story as RP_ORIGIN above. Production deploys
    # rebuild the EIF with their real consumer origin(s).
    CORS_ALLOWED_ORIGINS: "http://localhost:5174"
    # AWS endpoints via gvproxy TAP. host.containers.internal resolves to the
    # host from inside the enclave; in production gvproxy routes these to real
    # AWS endpoints, in the regtest harness they hit local-kms-proxy / LocalStack.
    # Baking them at build time means PCR0 attests this routing.
    AWS_ENDPOINT_URL_KMS: "http://host.containers.internal:4000"
    AWS_ENDPOINT_URL_SSM: "http://host.containers.internal:4566"
    AWS_ENDPOINT_URL_STS: "http://host.containers.internal:4566"
    AWS_ENDPOINT_URL_S3: "http://host.containers.internal:4566"
    AWS_ACCESS_KEY_ID: "test"
    AWS_SECRET_ACCESS_KEY: "test"

# Secrets managed by KMS inside the enclave.
# Each secret is generated as 32 random bytes, encrypted with KMS,
# stored in SSM, and decrypted at boot via attestation.
# The decrypted value (hex-encoded) is set as the specified env var.
secrets:
  # HMAC key for the per-session JWT (auth_token). Generated at first boot,
  # decrypted from KMS at every subsequent boot, exposed as $AUTH_TOKEN_KEY.
  - name: auth_token_key
    env_var: AUTH_TOKEN_KEY
